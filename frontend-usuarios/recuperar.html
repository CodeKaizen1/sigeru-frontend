<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'">
    <title>Recuperar contraseña - SiGeRU</title>

    <link rel="stylesheet" href="css/base.css?v=2">
    <link rel="stylesheet" href="css/layout.css?v=1">
    <link rel="stylesheet" href="css/components.css?v=1">
    <link rel="stylesheet" href="css/pages/auth.css">
</head>
<body>

    <header class="auth-header">
        <a href="../landing/index.html" class="auth-brand">
            <div class="auth-brand-mark">
                <span>SR</span>
            </div>

            <div class="auth-brand-text">
                <strong>SiGeRU</strong>
                <span>Gestión de Residuos Urbanos</span>
            </div>
        </a>

        <nav class="auth-nav">
            <a href="../landing/index.html">Inicio</a>
            <a href="login.html">Iniciar sesión</a>
        </nav>
    </header>

    <main class="contenedor-formulario">
        <section class="tarjeta-formulario">
            <h2>¿Olvidaste tu contraseña?</h2>

            <p class="texto-formulario">
                Ingresá tu correo electrónico y te enviamos un enlace para elegir una contraseña nueva.
            </p>

            <p id="avisoRecuperar" class="aviso-formulario oculto"></p>

            <form id="formRecuperar">
                <div class="grupo-formulario">
                    <label for="email">Correo electrónico</label>
                    <input type="email" id="email" name="email" placeholder="ejemplo@correo.com" required>
                </div>

                <button type="submit" class="btn-principal btn-ancho">Enviar enlace</button>
            </form>

            <p class="enlace-formulario">
                ¿Ya te acordaste?
                <a href="login.html">Iniciar sesión</a>
            </p>
        </section>
    </main>

    <footer class="footer">
        <p>Proyecto de Pasaje de Grado 2026 - SiGeRU</p>
    </footer>

    <script src="js/auth.js?v=6"></script>
    <script src="js/app.js"></script>
</body>
</html>
