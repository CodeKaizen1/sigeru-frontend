<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- CSP: sin cdnjs -- SheetJS se vendorizó localmente (vendor/sheetjs/, punto 29 de la Fase 4, 16/10) igual que ya estaba Chart.js (vendor/chartjs/); sin scripts/estilos inline. connect-src agrega OSRM (router.project-osrm.org, gratis y sin API key, igual criterio que Nominatim en landing/) para el orden real de las rutas -- ver controller.js, ordenPorOSRM, 15/10. -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self'; connect-src 'self' https://router.project-osrm.org; object-src 'none'; base-uri 'self'; form-action 'self'">
    <title>Panel administrador - SiGeRU</title>

    <link rel="stylesheet" href="css/base.css?v=2">
    <link rel="stylesheet" href="css/layout.css?v=2">
    <link rel="stylesheet" href="css/components.css?v=1">
    <link rel="stylesheet" href="css/pages/admin.css?v=46">
</head>
<body>

    <div class="admin-layout">

        <aside class="admin-sidebar">
            <div>
                <div class="admin-brand">
                    <div class="admin-logo">SR</div>

                    <div>
                        <h1>SiGeRU</h1>
                        <p>Panel administrador</p>
                    </div>

                    <button type="button" id="sidebarToggle" class="admin-sidebar-toggle" aria-label="Abrir menú" aria-expanded="false" aria-controls="adminMenu">
                        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
                    </button>
                </div>

                <nav class="admin-menu" id="adminMenu">
                    <button class="admin-menu-link active" data-module="resumen">Resumen</button>
                    <button class="admin-menu-link" data-module="incidencias">Incidencias</button>
                    <button class="admin-menu-link" data-module="informes">Informes</button>
                    <button class="admin-menu-link" data-module="contenedores">Contenedores</button>
                    <button class="admin-menu-link" data-module="camiones">Camiones</button>
                    <button class="admin-menu-link" data-module="cuadrillas">Cuadrillas</button>
                    <button class="admin-menu-link" data-module="rutas">Rutas</button>
                    <button class="admin-menu-link" data-module="centrosDeAcopio">Centros de acopio</button>
                    <button class="admin-menu-link" data-module="vertederos">Vertederos</button>
                    <button class="admin-menu-link" data-module="funcionarios">Funcionarios</button>
                    <button class="admin-menu-link" data-module="solicitudes">Solicitudes</button>
                </nav>
            </div>
        </aside>

        <main class="admin-main">

            <section class="module-header">
                <div>
                    <p class="admin-etiqueta">Administrador</p>
                    <h2 id="moduleTitle">Resumen general</h2>
                    <p id="moduleDescription">
                        Vista inicial del estado general del sistema.
                    </p>
                </div>

                <div class="header-acciones">
                    <div id="notificacionesContenedor" class="notificaciones-campanita-caja"></div>
                    <div id="cuentaContenedor" class="cuenta-menu-caja"></div>
                    <a href="#" id="btnSalir" class="admin-salir">Cerrar sesión</a>
                </div>
            </section>

            <section id="summaryCards" class="admin-resumen"></section>

            <section id="moduleTools" class="module-tools">
                <input
                    type="search"
                    id="searchInput"
                    placeholder="Buscar..."
                >

                <select id="stateFilter">
                    <option value="todos">Todos los estados</option>
                </select>

                <select id="pageSizeSelect" aria-label="Cantidad de registros por página" title="Cantidad de registros por página">
                    <option value="10">10 por página</option>
                    <option value="25">25 por página</option>
                    <option value="50">50 por página</option>
                </select>

                <button type="button" id="exportBtn" class="btn-secundario">Exportar</button>

                <button type="button" id="newRecordBtn" class="btn-principal">Nuevo</button>
            </section>

            <section id="filtrosExtra" class="filtros-extra oculto"></section>

            <section class="module-content" id="moduleContent">
                <div id="moduleList" class="data-list"></div>

                <div id="paginador" class="paginador"></div>

                <aside id="detailPanel" class="detail-panel">
                    <p class="detail-empty">
                        Seleccione un registro para ver más información.
                    </p>
                </aside>
            </section>
        </main>
    </div>

    <!-- Contenido armado por renderDetalle() en view.js. -->
    <div id="detailModal" class="modal-overlay oculto">
        <div class="modal-card">
            <div class="modal-header modal-header-detalle">
                <button type="button" id="detailModalCerrar" class="modal-cerrar" aria-label="Cerrar"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18"/><path d="M6 6l12 12"/></svg></button>
            </div>

            <div id="detailModalBody"></div>
        </div>
    </div>

    <div id="formModal" class="modal-overlay oculto">
        <div class="modal-card">
            <div class="modal-header">
                <h3 id="modalTitulo">Nuevo registro</h3>
                <button type="button" id="modalCerrar" class="modal-cerrar" aria-label="Cerrar"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18"/><path d="M6 6l12 12"/></svg></button>
            </div>

            <form id="formAlta">
                <div class="form-grid" id="modalFormFields"></div>

                <div class="modal-actions">
                    <button type="button" id="modalCancelar" class="btn-secundario">Cancelar</button>
                    <button type="submit" class="btn-principal">Guardar</button>
                </div>
            </form>
        </div>
    </div>

    <!-- SheetJS vendorizado localmente (vendor/sheetjs/, punto 29 de la Fase 4, 16/10 -- antes cdnjs), para el botón Exportar. -->
    <script src="vendor/sheetjs/xlsx.full.min.js"></script>
    <!-- Chart.js vendorizado localmente (vendor/chartjs/), para los gráficos de la pantalla de Resumen. Cdnjs estaba bloqueado en la red de Matías (ERR: "Chart is not defined"). -->
    <script src="vendor/chartjs/chart.umd.js"></script>
    <script type="module" src="js/admin/main.js?v=64"></script>
    <script type="module" src="js/salir.js?v=6"></script>
</body>
</html>
